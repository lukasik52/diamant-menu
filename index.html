.w{max-width:520px;margin:0 auto;padding:0 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.ib{width:44px;height:44px;background:none;border:0;color:#fff;position:relative;padding:0}
.ib svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib i{position:absolute;top:2px;right:0;background:var(--a);border-radius:10px;min-width:19px;height:19px;font:600 11px/19px Jost,sans-serif;font-style:normal;text-align:center}
.logo{text-align:center;flex:1}
.logo b{display:block;font:400 42px/1 "Marck Script",cursive}
.logo small{font-size:8.5px;letter-spacing:1.6px;font-weight:500;color:var(--mu)}
.hero{position:relative;height:158px;border-radius:20px;overflow:hidden;background:linear-gradient(110deg,rgba(90,10,55,.88),rgba(150,30,95,.5));border:1px solid var(--bd);margin-bottom:12px}
.ht{padding:20px 16px;max-width:58%;position:relative;z-index:2}
.ht p{margin:0;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu)}
.ht h1{margin:2px 0 6px;font:500 46px/1.05 "Playfair Display",Georgia,serif}
.ht span{font-size:12px;line-height:1.35;display:block}
.hp{position:absolute;right:6px;top:0;bottom:0;width:48%}
.hp img{position:absolute;width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.hp img:nth-child(1){right:62px;top:8px}.hp img:nth-child(2){right:0;top:38px}.hp img:nth-child(3){right:50px;bottom:6px;width:74px;height:74px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{position:relative;overflow:hidden;height:92px;border-radius:16px;border:1px solid var(--bd);background:rgba(120,15,70,.6);padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;font:500 15px/1.15 "Playfair Display",Georgia,serif}
.c>img{position:absolute;right:0;top:0;width:64%;height:100%;object-fit:cover}
.c::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(105,12,62,.95) 25%,rgba(105,12,62,.2))}
.c>svg,.c>span{position:relative;z-index:2}
.c svg{width:24px;height:24px;stroke:#ff9cc6;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c span{display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.c u{text-decoration:none;font-family:Jost,sans-serif}
.pt{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font:500 24px "Playfair Display",Georgia,serif}
.pt::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.35)}
.ph2{display:flex;align-items:center;gap:6px;margin:2px 0 8px}
.ph2 h2{margin:0;font:500 26px "Playfair Display",Georgia,serif}
.bk{background:none;border:0;color:#fff;font-size:28px;line-height:1;padding:6px 8px 6px 0}
.st{font:500 18px "Playfair Display",Georgia,serif;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.35)}
.it{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;background:var(--gl);border:1px solid var(--bd);border-radius:18px;padding:10px;margin-bottom:10px;backdrop-filter:blur(6px)}
.it.np{grid-template-columns:1fr;padding:12px 14px}
.ph{width:84px;height:84px;border-radius:14px;object-fit:cover}
.in{min-width:0}
.in h3{margin:0 0 3px;font-size:15px;font-weight:600;line-height:1.25}
.in p{margin:0 0 7px;font-size:12px;color:var(--mu);line-height:1.4}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wp{background:rgba(255,255,255,.14);border-radius:12px;padding:3px 10px;font-size:11px}
.tag{font-size:16px;font-weight:600;white-space:nowrap}
.bs{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:8px}
.add{background:linear-gradient(90deg,#f0629b,#e7548f);color:#fff;border:0;border-radius:16px;padding:7px 14px;font:500 12px Jost,sans-serif;white-space:nowrap}
.ft{text-align:center;font-size:13px;line-height:1.9;margin-top:26px}
.ft a{color:#fff;font-weight:500}
.zs{font-weight:700;font-size:17px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.bar button{display:flex;justify-content:space-between;width:100%;max-width:492px;margin:0 auto;background:linear-gradient(90deg,#f0629b,#d63f83);color:#fff;border:0;border-radius:16px;padding:15px 18px;font:600 15px Jost,sans-serif;box-shadow:0 6px 20px #5a0a3a66}
.sh{position:fixed;inset:0;background:#3a0824aa;display:none;align-items:flex-end;z-index:9}
.sh>div{width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;background:rgba(122,20,74,.97);border:1px solid var(--bd)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hd h2{margin:0;font:500 24px "Playfair Display",Georgia,serif}
.hd button{background:none;border:0;color:var(--mu);font:500 13px Jost,sans-serif}
.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.rt{width:52px;height:52px;border-radius:12px;object-fit:cover}
.rn{flex:1;min-width:0;font-size:13px}.rn b{display:block;font-weight:600}.rn small{color:var(--mu);font-size:12px}
.q{display:flex;align-items:center;gap:8px;white-space:nowrap}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:none;color:#fff;font-size:16px}
.t{display:flex;justify-content:space-between;font:600 18px Jost,sans-serif;padding:14px 0}
.call{display:block;text-align:center;background:linear-gradient(90deg,#f0629b,#d63f83);color:#fff;text-decoration:none;border-radius:16px;padding:15px;font-weight:600}

#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#b83b7c,#7a1a4c 72%);color:#fff;transition:opacity .8s ease,visibility .8s;animation:spOut .8s ease 4.5s forwards}
#sp.off{opacity:0;visibility:hidden;animation:none}
@keyframes spOut{to{opacity:0;visibility:hidden}}
#sp svg{width:76px;height:76px;animation:dm 2.2s ease-in-out infinite}
@keyframes dm{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
#sp b{font:400 60px/1.1 "Marck Script",cursive;margin-top:12px;opacity:0;animation:fi 1s ease .2s forwards}
#sp small{font:500 9px Jost,sans-serif;letter-spacing:2px;margin-top:6px;opacity:0;animation:fi 1s ease .6s forwards}
.sb{width:140px;height:2px;background:rgba(255,255,255,.25);margin-top:30px;border-radius:2px;overflow:hidden}
.sb i{display:block;height:100%;background:#fff;transform:translateX(-100%);animation:ld 2s ease-in-out forwards}
@keyframes fi{to{opacity:1}}
@keyframes ld{to{transform:none}}
.w{opacity:0;animation:wIn .8s ease 5s forwards}
body.rd .w{opacity:1;animation:none;transition:opacity .9s ease .1s}
@keyframes wIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#sp svg{animation:none}}
</style>
